<header class="site-header">
  <div class="site-header-inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav aria-label="Primary">
      <ul class="site-nav">
        <li>
          <a href="{{ '/' | relative_url }}">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="m2 7 6-5 6 5v7H9v-4H7v4H2z"/>
            </svg>
            Home
          </a>
        </li>
        <li>
          <a href="{{ '/projects/' | relative_url }}">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M1.5 4.5h5l1.5 2h6.5v7h-13zM1.5 4.5v-2h4l1.5 2"/>
            </svg>
            Projects
          </a>
        </li>
        <li>
          <a href="https://shivanshu-semwal.github.io/blog/">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M2 3.5c2.4-.8 4.4-.4 6 1v9c-1.6-1.4-3.6-1.8-6-1zM14 3.5c-2.4-.8-4.4-.4-6 1v9c1.6-1.4 3.6-1.8 6-1z"/>
            </svg>
            Blog
            <svg class="external-link-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M9 2h5v5M14 2 7 9M12 9v4H3V4h4"/>
            </svg>
            <span class="visually-hidden">(external site)</span>
          </a>
        </li>
        <li>
          <a href="{{ '/about/' | relative_url }}">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="5" r="2.5"/>
              <path d="M3 14c.4-2.5 2.2-4 5-4s4.6 1.5 5 4z"/>
            </svg>
            About
          </a>
        </li>
        <li>
          <div class="theme-control" data-theme-control hidden>
            <svg class="theme-mode-icon icon-dark" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M13.5 10A6 6 0 0 1 6 2.5 6.5 6.5 0 1 0 13.5 10Z"/>
            </svg>
            <svg class="theme-mode-icon icon-light" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="3"/>
              <path d="M8 1v2m0 10v2M1 8h2m10 0h2M3.05 3.05l1.4 1.4m7.1 7.1 1.4 1.4m0-9.9-1.4 1.4m-7.1 7.1-1.4 1.4"/>
            </svg>
            <svg class="theme-mode-icon icon-system" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="2" y="2" width="12" height="9" rx="1"/>
              <path d="M6 14h4m-2-3v3"/>
            </svg>
            <label class="visually-hidden" for="theme-mode">Color theme</label>
            <select id="theme-mode" class="theme-select" data-theme-select>
              <option value="dark">Dark</option>
              <option value="light">Light</option>
              <option value="system" selected>System</option>
            </select>
          </div>
        </li>
      </ul>
    </nav>
  </div>
</header>
