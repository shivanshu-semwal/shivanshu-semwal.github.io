<footer class="site-footer">
  <div class="site-footer-inner">
    <p>{{ site.author.name | escape }} · <a href="mailto:{{ site.author.email }}">{{ site.author.email }}</a></p>
    <ul class="social-links" aria-label="Social profiles">
      {% for link in site.social_links %}
        <li>
          <a href="{{ link.url }}">
            {%- include social-icon.html name=link.icon %}
            {{ link.label | escape }}
          </a>
        </li>
      {% endfor %}
    </ul>
  </div>
</footer>
