<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- seo %}
  <script>
    (function () {
      var storageKey = "theme";
      var root = document.documentElement;
      var mode = "system";

      try {
        var storedMode = window.localStorage.getItem(storageKey);
        if (storedMode === "dark" || storedMode === "light" || storedMode === "system") {
          mode = storedMode;
        }
      } catch (error) {
        // System preference remains available when storage is disabled.
      }

      function applyMode(nextMode) {
        mode = nextMode;
        root.setAttribute("data-theme-mode", mode);
        if (mode === "system") {
          root.removeAttribute("data-theme");
        } else {
          root.setAttribute("data-theme", mode);
        }
      }

      applyMode(mode);

      document.addEventListener("DOMContentLoaded", function () {
        var control = document.querySelector("[data-theme-control]");
        var select = document.querySelector("[data-theme-select]");
        if (!control || !select) {
          return;
        }

        select.value = mode;
        control.hidden = false;
        select.addEventListener("change", function () {
          applyMode(select.value);

          try {
            window.localStorage.setItem(storageKey, mode);
          } catch (error) {
            // The selected mode still applies for this page when storage is unavailable.
          }
        });
      });
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
